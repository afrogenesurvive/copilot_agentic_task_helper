<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The menu-bar popover.

      A second — deliberately tiny — entry point onto the SAME preload bridge the
      dashboard uses: four status values and the head of the priority queue. It
      exists so the operator can see whether the stack is alive without opening
      (or un-minimising) a 1080x720 window.

      It inherits the dashboard's CSP verbatim, so the same rule applies here:
      `style-src 'self'` has no 'unsafe-inline', which means an inline `style="…"`
      attribute and a <style> block are both silently DROPPED. Every visual rule
      lives in styles/tray.css, and the theme tokens are written through the CSSOM
      by tokens.js (CSSOM writes are not governed by CSP). Do not add inline
      styles — see the long note in index.html for the 22 that were dead for
      months before anyone noticed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Dev Centre</title>

    <!-- Same primitives as the dashboard, in the same cascade order, so the pills
         here and the pills in the status bar cannot drift apart: the pill + dot
         come from components/_status-bar.css, the notification source/level chips
         from components/_notification-center.css, and the button look from
         _form-fields.css. tray.css comes last because it has to undo _reset.css's
         opaque body background — the window is a macOS vibrancy panel and the
         material is only visible through a transparent page. -->
    <link rel="stylesheet" href="styles/_reset.css" />
    <link rel="stylesheet" href="styles/_layout.css" />
    <link rel="stylesheet" href="styles/_form-fields.css" />
    <link rel="stylesheet" href="styles/components/_status-bar.css" />
    <link rel="stylesheet" href="styles/components/_notification-center.css" />
    <link rel="stylesheet" href="styles/tray.css" />
  </head>
  <body class="tray">
    <main class="tray__panel">
      <header class="tray__head">
        <span class="tray__title">Dev Centre</span>
        <span class="tray__version" id="tray-version"></span>
      </header>

      <!-- The four status values stay visible whichever tab is open: they answer
           "is the stack alive?" without a click, which is the panel's first job. -->
      <div class="tray__pills">
        <button id="tray-health" class="status-pill" type="button" title="Backend health — click for the dashboard">
          <span class="status-dot"></span><span id="tray-health-text" data-pill-text>checking…</span>
        </button>
        <span id="tray-services" class="status-pill status-pill--plain" title="Local services running">services —</span>
        <span id="tray-queue" class="status-pill status-pill--plain" title="Unactioned priority queue items">queue —</span>
        <span id="tray-keys" class="status-pill status-pill--plain" title="Key store (personal_key_manager) availability">keys —</span>
      </div>

      <div class="tray__tabs" role="tablist" aria-label="Menu-bar panel sections">
        <button
          id="tray-tab-services"
          class="tray__tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="tray-panel-services"
          data-tray-tab="services"
        >
          Services
        </button>
        <button
          id="tray-tab-queues"
          class="tray__tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tray-panel-queues"
          data-tray-tab="queues"
        >
          Queues
        </button>
        <button
          id="tray-tab-notifications"
          class="tray__tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tray-panel-notifications"
          data-tray-tab="notifications"
        >
          Notifications<span class="tray__tab-count" id="tray-notif-count"></span>
        </button>
      </div>

      <section class="tray__pane" id="tray-panel-services" role="tabpanel" aria-labelledby="tray-tab-services">
        <ul class="tray__list" id="tray-services-list">
          <li class="empty">Loading…</li>
        </ul>
      </section>

      <section
        class="tray__pane"
        id="tray-panel-queues"
        role="tabpanel"
        aria-labelledby="tray-tab-queues"
        hidden
      >
        <div class="tray__subtabs" role="tablist" aria-label="Queue">
          <button
            id="tray-subtab-priority"
            class="tray__subtab"
            type="button"
            role="tab"
            aria-selected="true"
            data-tray-subtab="priority"
          >
            Priority
          </button>
          <button
            id="tray-subtab-misc"
            class="tray__subtab"
            type="button"
            role="tab"
            aria-selected="false"
            data-tray-subtab="misc"
          >
            Misc
          </button>
          <span class="tray__section-note" id="tray-items-note"></span>
        </div>
        <!-- Built in tray.js with createElement/textContent, never innerHTML: these
             rows carry frontdesk text, which is attacker-influenced. -->
        <ul class="tray__list" id="tray-items">
          <li class="empty">Loading…</li>
        </ul>
      </section>

      <section
        class="tray__pane"
        id="tray-panel-notifications"
        role="tabpanel"
        aria-labelledby="tray-tab-notifications"
        hidden
      >
        <div class="tray__subtabs">
          <span class="tray__section-label">Since the last clear</span>
          <span class="tray__section-note" id="tray-notif-note"></span>
        </div>
        <ul class="tray__list" id="tray-notif-list">
          <li class="empty">Loading…</li>
        </ul>
      </section>

      <footer class="tray__foot">
        <button id="tray-open" class="tray__open" type="button">Open dashboard</button>
      </footer>

      <!-- The zoom grip. The panel is deliberately NOT drag-resizable — a frameless
           window that can be resized reads as a normal window to macOS (edge
           affordances, Mission Control, the window cycle). This corner handle scales
           the panel and its whole UI instead, and a double-click resets it. Positioned
           entirely from tray.css: the page pins style-src 'self' with no
           'unsafe-inline'. -->
      <div
        id="tray-zoom"
        class="tray__zoom"
        role="separator"
        aria-label="Zoom panel"
        title="Drag to zoom the panel · double-click to reset"
      ></div>
    </main>

    <script src="tokens.js"></script>
    <script src="tray.js"></script>
  </body>
</html>
