# Netlify config for Frontdesk v2
# Login is license-key based (no username/password hashes), so no edge
# injection is needed. Config is fetched at runtime from /api/config.
# No secrets are written to disk during build or sent to the browser.
[build]
  base = "webapp/"
  publish = "public/"

# The webapp fetches its runtime config from a same-origin /api/config, which on
# Netlify is the `config` function (not the Express route used on the tunnel).
# Mirrored in webapp/public/_redirects so drag-and-drop deploys get it too.
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200
